name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Run script generator automation
        run: node .github/workflows/generate.js
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "CapLab Realistic Difficulty - ${{ steps.version.outputs.tag }}"
          files: |
            Realistic_Difficulty_settings.json
            realistic_difficulty_v*.txt
          generate_release_notes: true